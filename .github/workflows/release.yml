name: WristPrompt signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag on current main (for example v0.1.1)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  sign:
    name: Validate and sign matched APKs
    if: github.repository == 'grassified/WristPrompt' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source and version
        run: |
          python3 tools/verify_release.py --check-version --tag "$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git show --format= --check HEAD
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          audit = Path('docs') / f"RELEASE_AUDIT_{os.environ['RELEASE_TAG']}.md"
          if 'Publication gate: READY' not in audit.read_text().splitlines():
              sys.exit('Release audit still requires owner acceptance/signing; publication is blocked')
          PY
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          develocity-injection-enabled: false
      - name: Set up Android validation
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/wristprompt-android" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Unsigned automated gate
        run: |
          ./gradlew clean :wear:testDebugUnitTest :mobile:testDebugUnitTest :wear:assembleDebug :mobile:assembleDebug :wear:assembleRelease :mobile:assembleRelease :wear:lintDebug :mobile:lintDebug --no-daemon --console=plain
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_scenario_isolation.py
          python3 tools/check_markdown_links.py
      - name: Sign and verify production pair
        env:
          WRISTPROMPT_REQUIRE_RELEASE_SIGNING: 'true'
          WRISTPROMPT_RELEASE_STORE_FILE: ${{ runner.temp }}/wristprompt-signing/release.p12
          WRISTPROMPT_RELEASE_KEYSTORE_BASE64: ${{ secrets.WRISTPROMPT_RELEASE_KEYSTORE_BASE64 }}
          WRISTPROMPT_RELEASE_STORE_PASSWORD: ${{ secrets.WRISTPROMPT_RELEASE_STORE_PASSWORD }}
          WRISTPROMPT_RELEASE_KEY_ALIAS: ${{ secrets.WRISTPROMPT_RELEASE_KEY_ALIAS }}
          WRISTPROMPT_RELEASE_KEY_PASSWORD: ${{ secrets.WRISTPROMPT_RELEASE_KEY_PASSWORD }}
          WRISTPROMPT_RELEASE_CERT_SHA256: ${{ vars.WRISTPROMPT_RELEASE_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          import sys
          try:
              path = Path(os.environ['WRISTPROMPT_RELEASE_STORE_FILE'])
              raw = base64.b64decode(os.environ['WRISTPROMPT_RELEASE_KEYSTORE_BASE64'], validate=True)
              if not raw or len(raw) > 32768:
                  raise ValueError()
              path.parent.mkdir(mode=0o700)
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(raw)
          except Exception:
              sys.exit('Production signing keystore is missing or invalid (details withheld)')
          PY
          ./gradlew :wear:clean :mobile:clean :wear:assembleRelease :mobile:assembleRelease --no-daemon --console=plain
          python3 tools/verify_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/distribution"
      - name: Remove ephemeral signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'wristprompt-signing', ignore_errors=True)
          PY
      - name: Handoff verified production files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-pair
          path: |
            ${{ runner.temp }}/distribution/WristPrompt-${{ env.RELEASE_TAG }}-mobile.apk
            ${{ runner.temp }}/distribution/WristPrompt-${{ env.RELEASE_TAG }}-wear.apk
            ${{ runner.temp }}/distribution/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Reverify and publish prerelease
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-pair
          path: ${{ runner.temp }}/downloaded
      - name: Reverify downloaded APKs
        env:
          WRISTPROMPT_RELEASE_CERT_SHA256: ${{ vars.WRISTPROMPT_RELEASE_CERT_SHA256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'build-tools;36.0.0'
          (cd "$RUNNER_TEMP/downloaded" && sha256sum --check SHA256SUMS.txt)
          python3 tools/verify_release.py --tag "$RELEASE_TAG" --artifacts "$RUNNER_TEMP/downloaded" --output "$RUNNER_TEMP/publish"
      - name: Publish verified files from a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "WristPrompt $RELEASE_TAG" --notes-file "docs/RELEASE_NOTES_$RELEASE_TAG.md" \
            "$RUNNER_TEMP/publish/WristPrompt-$RELEASE_TAG-mobile.apk" \
            "$RUNNER_TEMP/publish/WristPrompt-$RELEASE_TAG-wear.apk" \
            "$RUNNER_TEMP/publish/SHA256SUMS.txt"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
