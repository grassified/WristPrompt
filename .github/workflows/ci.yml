name: WristPrompt CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Android and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          develocity-injection-enabled: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Isolate CI debug signing
        run: echo "ANDROID_USER_HOME=$RUNNER_TEMP/wristprompt-android" >> "$GITHUB_ENV"
      - name: Install repository Android SDK requirements
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"'
      - name: Unit tests, lint and both app variants
        run: >-
          ./gradlew
          :wear:testDebugUnitTest :mobile:testDebugUnitTest
          :wear:assembleDebug :mobile:assembleDebug
          :wear:assembleRelease :mobile:assembleRelease
          :wear:lintDebug :mobile:lintDebug
          --no-daemon --console=plain
      - name: Python tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Debug scenario isolation
        run: python3 tools/check_scenario_isolation.py
      - name: Local Markdown targets
        run: python3 tools/check_markdown_links.py
      - name: Whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: |
            wear/build/test-results/testDebugUnitTest/*.xml
            mobile/build/test-results/testDebugUnitTest/*.xml
            wear/build/reports/lint-results-debug.*
            mobile/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
